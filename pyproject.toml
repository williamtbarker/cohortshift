[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cohortshift"
version = "0.1.0"
description = "Leakage-resistant temporal validation and drift reporting for classifiers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Will Barker" }]
keywords = ["machine-learning", "temporal-validation", "data-drift", "leakage", "backtesting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pandas-stubs>=2.1",
  "ruff>=0.6",
  "setuptools>=68",
  "wheel>=0.43",
]

[project.scripts]
cohortshift = "cohortshift.cli:main"

[project.urls]
Homepage = "https://github.com/williamtbarker/cohortshift"
Repository = "https://github.com/williamtbarker/cohortshift"
Issues = "https://github.com/williamtbarker/cohortshift/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cohortshift = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_return_any = false
disallow_untyped_calls = false
disallow_any_generics = false
files = ["src"]
